services:
  java-client:
    image: maven:3.9-eclipse-temurin-8
    container_name: java-client
    working_dir: /app
    depends_on:
      ccm-cluster:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - .:/app
      - /Users/siyaohe/.m2/repository:/root/.m2/repository
    networks:
      cassandra-net:
        ipv4_address: 172.20.0.10
    command: >
      sh -c "mvn compile verify -pl integration-tests -Dtest=GracefulDisconnectIT"

  ccm-cluster:
    image: apache.jfrog.io/cassan-docker/apache/cassandra-java-driver-testing-ubuntu2204:latest
    container_name: ccm-cluster
    hostname: ccm-cluster
    user: root
    ports:
      - "9042:9042"
      - "9043:9043"
      - "9044:9044"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      cassandra-net:
        ipv4_address: 172.20.0.2
    environment:
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=512M
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    volumes:
      - .:/home/docker/cassandra-java-driver
      - /Users/siyaohe/Documents/DataStax/Repos/cassandra:/home/docker/cassandra
    entrypoint: ["/bin/bash", "-l", "-c"]
    command:
      - |
        bash /home/docker/cassandra-java-driver/ci/create-user.sh docker $${HOST_UID} $${HOST_GID} /home/docker/cassandra-java-driver &&
        . /home/docker/env.txt &&
        pip install -U cqlsh &&
        sudo apt install iproute2 &&
        ccm create test -n 3 --install-dir=/home/docker/cassandra &&
        ccm node1 updateconf \
        "rpc_address: 0.0.0.0" \
        "broadcast_rpc_address: 172.20.0.2" \
        "native_transport_port: 9042" &&
        ccm node2 updateconf \
        "rpc_address: 0.0.0.0" \
        "broadcast_rpc_address: 172.20.0.2" \
        "native_transport_port: 9043" &&
        ccm node3 updateconf \
        "rpc_address: 0.0.0.0" \
        "broadcast_rpc_address: 172.20.0.2" \
        "native_transport_port: 9044" &&
        ccm start &&
        touch /home/docker/.setup_complete &&
        tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/home/docker/.setup_complete"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
networks:
  cassandra-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16